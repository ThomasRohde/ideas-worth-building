[project]
name = "ideas-worth-building-tools"
version = "0.1.0"
description = "Dependency-free repository mechanics for Ideas Worth Building"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pinned explicitly; ruff's default selection changes between releases.
# E501 is excluded deliberately: line length is a `ruff format` concern here.
select = ["E4", "E7", "E9", "F", "I", "UP"]
